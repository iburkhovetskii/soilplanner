server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    location = /soilplanner {
        return 301 /soilplanner/;
    }

    # Префикс срезается: /soilplanner/api/... уходит в приложение как /api/...
    location /soilplanner/ {
        proxy_pass http://soilplanner:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
