[pytest]
# Весь backend импортируется как `app.*`, поэтому корень импорта — backend/.
# Опция pythonpath применяется раньше загрузки conftest, sys.path-хаки не нужны.
pythonpath = backend
testpaths = backend/tests
addopts = -q --strict-markers
cache_dir = /tmp/soil-planner-pytest-cache
markers =
    realdata: читает реальные справочники из backend/data (parquet/csv, без Excel)
